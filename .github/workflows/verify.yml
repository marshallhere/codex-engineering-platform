name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.1'
      - run: python -m pip install ruff==0.13.3 bandit==1.8.6 build==1.3.0
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m unittest discover -s supervisor/tests -v
      - run: python -m unittest discover -s project/tests -v
      - run: ruff check src/cep tests native scripts/check_publication.py scripts/security_gate.py packaging setup.py
      - run: npm ci --ignore-scripts
      - run: npm run spec:validate
      - run: npm audit --audit-level=high
      - name: Retain static findings and enforce reviewed security gate
        run: |
          bandit -r src/cep -f json -o bandit.json || test "$?" = 1
          python scripts/security_gate.py bandit.json
      - name: Enforce zero findings in privileged experiment code
        run: bandit -r native -f json -o native-bandit.json
      - run: python -m build
      - run: python packaging/verify.py --wheel dist/codex_engineering_platform-0.1.0a1-py3-none-any.whl --sdist dist/codex_engineering_platform-0.1.0a1.tar.gz --evidence /tmp/cep-packaging-evidence
      - run: python scripts/check_publication.py .
  native-boundary:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.1'
      - run: npm install --global --ignore-scripts @openai/codex@0.162.1
      - run: PYTHONPATH=src python -m unittest discover -s tests -p test_demo.py -v
      - run: PYTHONPATH=src python -m unittest discover -s tests -p test_lifecycle.py -v
      - run: PYTHONPATH=src python -m unittest discover -s tests -p test_toolchains.py -v
