# MERGE into ~/.codex/config.toml; do not overwrite or duplicate TOML tables.
# Verify your installed Codex version recognizes these settings.
approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"
model_reasoning_effort = "medium"

[sandbox_workspace_write]
network_access = false

[features]
multi_agent = true
hooks = true
memories = true  # Optional native Codex local memory; review retention/privacy settings.

[memories]
use_memories = true
generate_memories = true
disable_on_external_context = true

[agents]
max_concurrent_threads_per_session = 5
